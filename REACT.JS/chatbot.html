<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Chatbot</title>
  <link rel="icon" type="image/png" sizes="1080x1080" href="./favicon.png?v=2">
  <style>
    body
    {
      font-family: Arial;
      margin-top:0px;
      margin-bottom:0px;
    }
    .send-button
    {
      background-color:rgb(25, 135, 84);
      color:white;
      border-radius:10px;
      padding:12px 20px;
      margin-left:10px;
      border:none;
      font-size:15px;
      cursor:pointer;
    }
    .input
    {
      height:39px;
      border-radius:10px;
      width:500px;
      border-width:1px;
      flex-grow:1;
    }
    .div
    {
      display:flex;

      margin-bottom:60px;
    }
    .div2
    {
      max-width:600px;
      margin-left:auto;
      margin-right:auto;
      height:100vh;
      display:flex;
      flex-direction:column;
    } 
    .user
    {
      display:flex;
      justify-content:end;
      align-items:start;
    }
    .robot
    {
      display:flex;
      align-items:start;
    }
    .div3
    {
      background-color:rgb(238,238,238);
      padding:15px 20px;
      border-radius:10px;
      margin-right:10px;
      margin-left:10px;
      margin-bottom:20px;
      max-width:300px;
    }
    .profile-img
    {
      width:45px;
    }
    .div4
    {
      flex-grow:1;
      margin-top:20px;
      overflow:scroll;
      scrollbar-width:none;
    }
  </style>
</head>

<body>
  <div class="js-container"></div>

  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
  <script src="https://unpkg.com/supersimpledev/babel.js"></script>
  <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
  <script type="text/babel">

    function App() {
      const [chatMessages, setChatMessages] = React.useState([
        
      ]);

      return (
        <div className="div2">          
          <ChatMessages chatMessages={chatMessages} />
          <ChatInput
            chatMessages={chatMessages}
            setChatMessages={setChatMessages}
          />
        </div>
      );
    }

    function ChatInput({ chatMessages, setChatMessages }) {
      const [inputText, setInputText] = React.useState('');

      function saveInputText(event) {
        setInputText(event.target.value);
      }

      function sendMessage() {
        const newChatMessages=[
          ...chatMessages,
          {
            message: inputText,
            sender: 'user',
            id: crypto.randomUUID()
          }
        ]
        setChatMessages(newChatMessages);
        const response=Chatbot.getResponse(inputText);
        setChatMessages([
          ...newChatMessages,
          {
            message: response,
            sender: 'robot',
            id: crypto.randomUUID()
          }
        ]);
        setInputText('');
      }

      return (
        <>
          <div className="div"><input
            className="input"
            placeholder="Send a message to Chatbot"
            size="30"
            value={inputText}
            onChange={saveInputText}
          />

          <button className="send-button" onClick={sendMessage}>Send</button>
         </div>
          </>
      );
    } 

    function ChatMessages({ chatMessages }) {
     const chatMessagesRef=React.useRef(null);
     React.useEffect(()=>{
        const containerElem=chatMessagesRef.current;
        if(containerElem)
        containerElem.scrollTop=containerElem.scrollHeight;
     },[chatMessages])
     
      return (
        <div className="div4" ref={chatMessagesRef}>
          {chatMessages.map((chatMessage) => (
            <ChatMessage
              message={chatMessage.message}
              sender={chatMessage.sender}
              key={chatMessage.id}
            />
          ))}
        </div>
      );
    }

    function ChatMessage({ message, sender }) {
      return (
        <div className={sender==='user'?'user':'robot'}>
          {sender === 'robot' && (
            <img src="bot-img.png" className="profile-img" alt="Robot" />
          )}

          <div class="div3">{message}</div>

          {sender === 'user' && (
            <img src="profile-img.png" className="profile-img" width="50" alt="User" />
          )}
        </div>
      );
    }

    const container = document.querySelector('.js-container');

    ReactDOM.createRoot(container).render(<App />);

  </script>
</body>
</html>
