<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="rps4.css">
  </head>

  <body>

    <p class="title">Rock Paper Scissors</p>

    <button class="icon" onclick="
      playGame('rock');
    ">
      <img class="a" src="emoji/rock-emoji.png">
    </button>

    <button class="icon" onclick="
      playGame('paper');
    ">
      <img class="a" src="emoji/paper-emoji.png">
    </button>

    <button class="icon" onclick="
      playGame('scissors');
    ">
      <img class="a" src="emoji/scissors-emoji.png">
    </button>
    <p class="js-result result">You win</p>
    <p class="js-moves">
    </p>
    <p class="js-score score"></p>
    <button class="reset" onclick="
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      localStorage.removeItem('score');
      updateScoreElement();
    ">
      Reset Score
    </button>

    <script src="rps4.js"></script>

  </body>
</html>
