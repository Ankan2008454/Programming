<!DOCTYPE html>
<html>

<head>

    <title>whatsapp clone</title>

    <link rel="stylesheet" href="styles/whatsapp.css">

</head>

<body>

    <div class="icons"></div>

    <div class="chats">

        <div>

            <div class="profile">

                <div class="header">

                    <input class="search-bar"
                        type="text"
                        placeholder="Search or start a new chat">

                    <div class="s">
                        <img src="icons/search.svg">
                    </div>

                    <div class="tips">

                        <button>All</button>

                        <button>Unread</button>

                        <button>Favourites</button>

                    </div>

                </div>


                <div class="sidebar">

                    <div class="sidebar">

                        <div class="sidebar-icon">
                            <img src="icons/chat.svg">
                        </div>

                        <div class="sidebar-icon">
                            <img src="icons/call.svg">
                        </div>

                        <div class="sidebar-icon">
                            <img src="icons/status.svg">
                        </div>

                        <div class="sidebar-icon">
                            <img src="icons/community.svg">
                        </div>

                        <div class="sidebar-icon">
                            <img src="icons/metaAI.png">
                        </div>

                    </div>

                </div>


                <div class="chatlist">

                    <div class="profile-details" data-user="Ankit">

                        <p class="chats-details">
                            Ankit(OWN)
                        </p>

                        <div class="img">
                            <img class="img-real" src="profile/A.png">
                        </div>

                    </div>


                    <div class="profile-details" data-user="Ayush">

                        <p class="chats-details">
                            Ayush(VSN)
                        </p>

                        <div class="img">
                            <img class="img-real" src="profile/ayush.png">
                        </div>

                    </div>


                    <div class="profile-details"
                        data-user="GROUP OF FAMILY❤️❤️">

                        <p class="chats-details">
                            GROUP OF FAMILY❤️❤️
                        </p>

                        <div class="img">
                            <img class="img-real" src="profile/gof.png">
                        </div>

                    </div>


                    <div class="profile-details" data-user="baba">

                        <p class="chats-details">
                            baba
                        </p>

                        <div class="img">
                            <img class="img-real" src="profile/baba.png">
                        </div>

                    </div>


                    <div class="profile-details" data-user="Ankan(You)">

                        <p class="chats-details">
                            Ankan(You)
                        </p>

                        <div class="img">
                            <img class="img-real" src="profile/own.png">
                        </div>

                    </div>


                    <div class="profile-details" data-user="Sounak(VSN)">

                        <p class="chats-details">
                            Sounak(VSN)
                        </p>

                        <div class="img">
                            <img class="img-real" src="profile/sounak.png">
                        </div>

                    </div>


                    <div class="profile-details" data-user="Avinava(OWN)">

                        <p class="chats-details">
                            Avinava(OWN)
                        </p>

                        <div class="img">
                            <img class="img-real" src="profile/avinava.png">
                        </div>

                    </div>


                    <div class="profile-details" data-user="JioHome">

                        <p class="chats-details">
                            JioHome
                        </p>

                        <div class="img">
                            <img class="img-real" src="profile/jio.png">
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- CHAT PAGE -->

    <div class="chat-page">

        <div class="gof">

            <img class="img-gof" src="profile/gof.png">

            <div class="a">
                GROUP OF FAMILY❤️❤️
            </div>

            <div class="profile-icons">

                <img src="icons/video.svg">

                <img src="icons/search.svg">

                <img src="icons/menu.svg">

            </div>

        </div>


        <div class="main-chat">

            <div class="t2">
                <p class="text">hello</p>
            </div>

        </div>


        <!-- EMOJI PICKER -->

        <div class="emoji-picker">

            <button>😀</button>
            <button>😃</button>
            <button>😄</button>
            <button>😁</button>
            <button>😂</button>
            <button>🤣</button>
            <button>😊</button>
            <button>😍</button>
            <button>🥰</button>
            <button>😘</button>
            <button>😎</button>
            <button>😭</button>
            <button>😡</button>
            <button>👍</button>
            <button>👏</button>
            <button>❤️</button>
            <button>🔥</button>
            <button>🎉</button>
            <button>💯</button>
            <button>🚀</button>

        </div>


        <!-- MESSAGE BAR -->

        <div class="chat">

            <div class="message">

                <input class="search-bar2"
                    type="text"
                    placeholder="Search or start a new chat">


                <div class="mi">

                    <img class="message-icons"
                        src="icons/plus.svg">

                    <!-- YOUR ORIGINAL STICKER ICON -->

                    <img class="message-icons sticker-icon"
                        src="icons/sticker.svg">

                </div>


                <div class="li">

                    <img id="send-mic"
                        class="message-icons"
                        src="icons/mic.svg">

                </div>

            </div>

        </div>

    </div>


    <script src="whatsapp.js"></script>

</body>

</html>
