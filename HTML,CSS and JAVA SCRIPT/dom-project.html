<!--DOCUMENT OBJECT MODEL-->
<!DOCTYPE html>
<html>
    <head>
        <title>DOM Project</title>
        <style>
            .subscribe-button
            {
                border:none;
                background-color:black;
                color:white;
                padding-top:10px;
                padding-bottom:10px;
                padding-left:15px;
                padding-right:15px;
                border-radius:50px;
                font-weight:bold;
                cursor:pointer;
            }
            .is-subscribed
            {
                background-color:rgb(240,240,240);
                color:black;
                padding-top:10px;
                padding-bottom:10px;
                padding-left:15px;
                padding-right:15px;
                border-radius:50px;
                font-weight:bold;
                cursor:pointer;
            }
            .js-cost-input
            {
                font-size:15px;
                padding:10px;
            }
            .b
            {
                border:none;
                background-color:green;
                font-weight:bold;
                padding:13px;
                color:white;
                cursor:pointer;
            }
        </style>
    </head>
    <body>
           <p>
            Youtube Subscribe Button
           </p>
           <button onclick="
                subscribe();
           "
           class="js-subscribe-button subscribe-button">
            Subscribe
           </button>
           <p>Amazon Shipping Calculate</p>
           <p>Orders under $40=+$10 shipping.</p>
           <p>Orders over $40=FREE shipping.</p>
           <input placeholder="Cost of order" class="js-cost-input" onkeydown="console.log(event.key);
           if(event.key==='Enter')
           {
                calculateTotal();
           }"">
           <button class="b" onclick="calculateTotal()"" >Calculate </button>
           <p class="js-total-cost"></p>
        <script>
            function calculateTotal()
            {
                const inputElement=document.querySelector('.js-cost-input');
                let cost=Number(inputElement.value);
                if(cost<40)
                {
                    cost=cost+10;
                }
                document.querySelector('.js-total-cost').innerHTML=`$${cost}`;
            }
            function subscribe()
            {
                 const onbutton=document.querySelector('.js-subscribe-button')
                if(onbutton.innerText==='Subscribe')
                {
                    onbutton.innerHTML='Subscribed';
                    onbutton.classList.add('is-subscribed');
                }
                else
                {
                    onbutton.innerHTML='Subscribe';
                    onbutton.classList.remove('is-subscribed');
                }
            }
        </script>
    </body>
</html>
